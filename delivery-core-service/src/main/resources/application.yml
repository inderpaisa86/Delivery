server:
  port: ${SERVER_PORT:8080}

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/delivery_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

# WhatsApp Business API
whatsapp:
  verify:
    token: ${WHATSAPP_VERIFY_TOKEN:mi-token-secreto}
  api:
    url: ${WHATSAPP_API_URL:https://graph.facebook.com/v18.0}
    token: ${WHATSAPP_API_TOKEN:}
    phone-number-id: ${WHATSAPP_PHONE_NUMBER_ID:}

# Seguridad
app:
  api:
    token: ${APP_API_TOKEN:delivery-internal-token}
  tracking:
    secret: ${TRACKING_SECRET:tracking-secret-key}

# Swagger / OpenAPI
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
