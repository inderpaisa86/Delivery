spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

# WhatsApp Business API
whatsapp:
  verify:
    token: ${WHATSAPP_VERIFY_TOKEN:mi-token-secreto}
  api:
    url: ${WHATSAPP_API_URL:https://graph.facebook.com/v18.0}
    token: ${WHATSAPP_API_TOKEN:}
    phone-number-id: ${WHATSAPP_PHONE_NUMBER_ID:}

# Seguridad
app:
  api:
    token: ${APP_API_TOKEN:delivery-internal-token}
  tracking:
    secret: ${TRACKING_SECRET:tracking-secret-key}
  rate-limit:
    webhook-requests-per-minute: ${RATE_LIMIT_WEBHOOK:60}

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

# Swagger
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
