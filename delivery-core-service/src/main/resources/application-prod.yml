# =============================================
# Perfil PROD - Producción
# =============================================
server:
  port: ${SERVER_PORT:8080}

spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

# Swagger deshabilitado en producción
springdoc:
  swagger-ui:
    enabled: false
  api-docs:
    enabled: false

# Logs mínimos en JSON
logging:
  level:
    root: WARN
    org.delivery: INFO
