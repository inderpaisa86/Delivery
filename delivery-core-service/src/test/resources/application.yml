spring:
  datasource:
    url: jdbc:tc:postgresql:16-alpine:///delivery_test
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false

whatsapp:
  verify:
    token: mi-token-secreto
  api:
    url: https://graph.facebook.com/v18.0
    token: test-token
    phone-number-id: test-phone-id

app:
  api:
    token: delivery-internal-token
  tracking:
    secret: tracking-secret-key
  rate-limit:
    webhook-requests-per-minute: 1000
